<article class="glass p-5 sm:p-6 rounded-2xl card-hover border-l-4 border-accent reveal flex flex-col justify-between">
    <div>
        <p class="text-accent font-mono text-[10px] uppercase mb-2">{{ post.category }}</p>
        <h4 class="text-base sm:text-lg md:text-xl font-bold mb-3 text-white leading-tight article-title">
            <a href="{{ post.url | relative_url }}" class="hover:text-accent transition">{{ post.title }}</a>
        </h4>
        <p class="text-slate-400 text-xs sm:text-sm mb-4 line-clamp-3 leading-relaxed">
            {{ post.description }}
        </p>
    </div>
    <div class="flex flex-wrap items-center justify-between gap-3 text-xs pt-2 border-t border-white/5">
        <span class="text-slate-500 text-[11px]">{{ post.date | date: "%B %d, %Y" }}</span>
        <div class="flex items-center space-x-3">
            {% if post.linkedin_url %}
            <a href="{{ post.linkedin_url }}" target="_blank" class="text-accent font-bold hover:underline inline-flex items-center gap-1 text-[11px]">
                <i class="fab fa-linkedin text-xs"></i> Post
            </a>
            {% endif %}
            {% if post.external_url %}
            <a href="{{ post.external_url }}" target="_blank" class="text-accent hover:text-orange-400 text-[11px] font-bold flex items-center gap-1 transition">
                <i class="fas fa-newspaper text-xs"></i> Full Article
            </a>
            {% endif %}
        </div>
    </div>
</article>
