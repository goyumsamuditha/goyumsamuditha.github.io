---
layout: default
---
<article class="py-28 px-4 sm:px-6 max-w-4xl mx-auto min-h-screen">
    <div class="mb-8">
        <a href="{{ '/articles/' | relative_url }}" class="text-accent text-sm font-semibold hover:underline inline-flex items-center gap-1">
            <i class="fas fa-arrow-left"></i> All Articles
        </a>
    </div>

    <div class="mb-4">
        <span class="text-accent font-mono text-xs uppercase bg-accent/10 px-3 py-1 rounded-full border border-accent/20">
            {{ page.category }}
        </span>
    </div>

    <h1 class="text-3xl sm:text-5xl font-extrabold text-white mb-4 leading-tight">{{ page.title }}</h1>
    <p class="text-slate-500 text-xs mb-8">{{ page.date | date: "%B %d, %Y" }}</p>

    <div class="prose prose-invert max-w-none text-slate-300 space-y-6 leading-relaxed">
        {{ content }}
    </div>

    <div class="mt-12 pt-6 border-t border-white/10 flex gap-4">
        {% if page.linkedin_url %}
        <a href="{{ page.linkedin_url }}" target="_blank" class="text-accent hover:underline flex items-center gap-2 text-sm">
            <i class="fab fa-linkedin"></i> View on LinkedIn
        </a>
        {% endif %}
        {% if page.external_url %}
        <a href="{{ page.external_url }}" target="_blank" class="text-accent hover:underline flex items-center gap-2 text-sm">
            <i class="fas fa-newspaper"></i> Read on Blogspot
        </a>
        {% endif %}
    </div>
</article>
